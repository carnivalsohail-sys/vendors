<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnival Cloud Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090a0f; --surface: #12141c; --surface2: #1a1d27;
  --border: #242836; --accent: #f0a500; --accent-glow: rgba(240, 165, 0, 0.2);
  --green: #2dca73; --red: #e05c3a; --blue: #4ea8f5; --purple: #9b8cff;
  --text: #f0f2fa; --muted: #8e96ab; --heading: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; }

/* ── GLOWING HEADER ── */
.header { text-align: center; margin-bottom: 50px; position: relative; }
.header h1 { font-family: 'DM Serif Display', serif; font-size: 42px; color: var(--heading); letter-spacing: 1px; margin-bottom: 10px; }
.header p { color: var(--muted); font-size: 16px; font-family: 'DM Mono', monospace; text-transform: uppercase; letter-spacing: 2px; }
.header::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 100px; background: var(--accent); filter: blur(100px); opacity: 0.15; z-index: -1; }

.controls { display: flex; gap: 10px; margin-bottom: 40px; }
.btn { padding: 12px 24px; border-radius: 9px; border: none; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 15px; transition: all .18s; display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #000; box-shadow: 0 4px 14px rgba(240,165,0,.2); }
.btn:hover { background: #ffc72a; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,165,0,.4); }

/* ── MASTER STATS ── */
.master-stats { display: flex; gap: 20px; max-width: 1000px; width: 100%; margin-bottom: 40px; flex-wrap: wrap; }
.stat-box { flex: 1; min-width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 30px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.stat-box::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; }
.stat-box.total-bill::before { background: var(--blue); }
.stat-box.total-paid::before { background: var(--green); }
.stat-box.total-bal::before { background: var(--red); }
.stat-label { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-family: 'DM Mono', monospace; }
.stat-value { font-size: 42px; font-weight: 700; color: var(--heading); transition: color 0.3s; }

/* ── VENDOR GRID ── */
.vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: 1000px; width: 100%; }
.vendor-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: all 0.2s; position: relative; display: flex; flex-direction: column; gap: 16px; }
.vendor-card:hover { transform: translateY(-5px); border-color: rgba(240, 165, 0, 0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.v-header { display: flex; justify-content: space-between; align-items: flex-start; }
.v-name { font-size: 22px; font-weight: 600; color: var(--heading); }
.v-badge { background: var(--surface2); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }
.v-stats { display: flex; flex-direction: column; gap: 8px; }
.v-row { display: flex; justify-content: space-between; font-size: 16px; }
.v-row span:first-child { color: var(--muted); }
.v-row span:last-child { font-weight: 500; font-family: 'DM Mono', monospace; }

/* ── PROGRESS BAR ── */
.progress-bg { width: 100%; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--blue)); border-radius: 3px; transition: width 1s cubic-bezier(0.1, 0.7, 0.1, 1); }

.empty-state { text-align: center; padding: 60px; color: var(--muted); font-size: 16px; grid-column: 1 / -1; background: var(--surface); border-radius: 16px; border: 1px dashed var(--border); }
.status-msg { margin-top: 10px; font-size: 14px; font-family: 'DM Mono', monospace; color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>Carnival Cloud Master</h1>
  <p>Live GitHub Gist Aggregation</p>
</div>

<div class="controls">
  <button class="btn" onclick="fetchFromCloud()" id="syncBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
    Sync Entire Database from Cloud
  </button>
</div>
<div id="statusMsg" class="status-msg"></div>

<div class="master-stats">
  <div class="stat-box total-bill">
    <div class="stat-label">Total Business Liabilities</div>
    <div class="stat-value" id="ms-bill">₹ 0</div>
  </div>
  <div class="stat-box total-paid">
    <div class="stat-label">Total Amount Cleared</div>
    <div class="stat-value" id="ms-paid">₹ 0</div>
  </div>
  <div class="stat-box total-bal">
    <div class="stat-label">Net Outstanding Balance</div>
    <div class="stat-value" id="ms-bal">₹ 0</div>
  </div>
</div>

<div class="vendor-grid" id="vendorGrid">
  <div class="empty-state">Click "Sync from Cloud" to fetch your live vendor data from GitHub Gists.</div>
</div>

<script>
function fmt(n) { return Math.round(n).toLocaleString('en-IN'); }

async function fetchFromCloud() {
  const token = localStorage.getItem('vendor_gist_token');
  const gistId = localStorage.getItem('vendor_gist_id');
  const statusEl = document.getElementById('statusMsg');
  
  if (!token || !gistId) {
    statusEl.textContent = 'Error: GitHub Token or Gist ID not found in browser storage.';
    statusEl.style.color = 'var(--red)';
    return;
  }

  statusEl.textContent = 'Fetching from GitHub...';
  statusEl.style.color = 'var(--accent)';
  document.getElementById('syncBtn').style.opacity = '0.5';

  try {
    const res = await fetch('https://api.github.com/gists/' + gistId, {
      headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
    });
    
    if (!res.ok) throw new Error('Network response was not ok');
    const data = await res.json();
    
    const vendors = [];
    let masterBill = 0, masterPaid = 0;

    // Loop through all files in the Gist
    for (const filename in data.files) {
      if (filename.endsWith('data.json')) {
        const prefix = filename.replace('data.json', '');
        try {
          const content = JSON.parse(data.files[filename].content);
          
          let vBill = 0, vPaid = 0;
          if (content.monthTotals) {
            for (const mk in content.monthTotals) {
              vBill += content.monthTotals[mk].total || 0;
              vPaid += content.monthTotals[mk].paid || 0;
            }
          }
          if (content.openingBalance) {
            vBill += content.openingBalance.billed || 0;
            vPaid += content.openingBalance.paid || 0;
          }

          if (vBill > 0 || vPaid > 0) {
            let name = 'Unknown Vendor';
            if (prefix === 'rv4_') name = 'Ravi (Production)';
            else if (prefix === 'shab_v5_') name = 'Shabbir (Flex)';
            else name = 'Vendor (' + prefix.replace('_','') + ')';

            let lastUpdated = content.last_updated ? new Date(content.last_updated).toLocaleString('en-IN') : 'Unknown';

            vendors.push({ name, prefix, bill: vBill, paid: vPaid, bal: vBill - vPaid, updated: lastUpdated });
            masterBill += vBill;
            masterPaid += vPaid;
          }
        } catch(e) { console.error('Error parsing ' + filename, e); }
      }
    }

    // Update Master Stats
    document.getElementById('ms-bill').textContent = '₹ ' + fmt(masterBill);
    document.getElementById('ms-paid').textContent = '₹ ' + fmt(masterPaid);
    document.getElementById('ms-bal').textContent = '₹ ' + fmt(masterBill - masterPaid);

    // Render Grid
    const grid = document.getElementById('vendorGrid');
    if (vendors.length === 0) {
      grid.innerHTML = '<div class="empty-state">No vendor data files found in this Gist.</div>';
    } else {
      vendors.sort((a,b) => b.bal - a.bal);
      grid.innerHTML = vendors.map(v => {
        const pct = v.bill > 0 ? Math.min(100, Math.round((v.paid / v.bill) * 100)) : 0;
        const isCleared = v.bal <= 0;
        
        return `
          <div class="vendor-card">
            <div class="v-header">
              <div class="v-name">${v.name}</div>
              <div class="v-badge">${v.prefix}</div>
            </div>
            <div class="v-stats">
              <div class="v-row"><span>Total Billed:</span> <span>₹ ${fmt(v.bill)}</span></div>
              <div class="v-row"><span>Total Paid:</span> <span style="color:var(--green)">₹ ${fmt(v.paid)}</span></div>
              <div class="v-row" style="margin-top:8px; border-top:1px dashed var(--border); padding-top:12px;">
                <span style="color:${isCleared ? 'var(--green)' : 'var(--red)'}">${isCleared ? '✓ Cleared' : 'Balance Due:'}</span> 
                <span style="color:${isCleared ? 'var(--green)' : 'var(--heading)'}; font-size:22px;">₹ ${fmt(Math.abs(v.bal))}</span>
              </div>
            </div>
            <div style="margin-top: 8px;">
              <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:4px; font-family:'DM Mono',monospace">
                <span>Progress</span><span>${pct}%</span>
              </div>
              <div class="progress-bg">
                <div class="progress-fill" style="width: ${pct}%"></div>
              </div>
              <div style="font-size:10px; color:var(--muted); margin-top:12px; text-align:right;">Last Sync: ${v.updated}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    statusEl.textContent = '✓ Successfully synced ' + vendors.length + ' vendors from GitHub Gist!';
    statusEl.style.color = 'var(--green)';

  } catch(e) {
    statusEl.textContent = 'Error: Failed to fetch from GitHub. Check your network or token.';
    statusEl.style.color = 'var(--red)';
    console.error(e);
  } finally {
    document.getElementById('syncBtn').style.opacity = '1';
  }
}
</script>
</body>
</html>
